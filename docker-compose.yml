# 本地开发用:从源码构建镜像运行(需要本仓库源码与 Docker 构建上下文)。
# 部署(拉 ghcr 发布镜像)请复制 docker-compose.example.yml 使用。
services:
  glm-cc-gateway:
    build: .
    image: glm-cc-gateway:local
    container_name: glm-cc-gateway
    ports:
      - "127.0.0.1:8080:8080"   # 默认仅本机可达,开放前请配置 api_keys_allow
    volumes:
      - ./data:/app/data      # 配置/身份/会话池/用量全在此目录,持久保留
    restart: unless-stopped
