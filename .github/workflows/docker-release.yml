# 推送 tag 时构建镜像并发布到 ghcr.io。
# 触发:git tag v1.2.3(或任意 tag)→ 镜像 ghcr.io/<owner>/<repo>:<tag>
# 首次发布后如需公开/私有切换,在 GitHub → Packages 里设置。
name: docker-release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr 要求镜像名全小写;仓库名可能含大写,统一转换。
      - name: Lowercase image name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            # 语义化 tag:v1.2.3 → 1.2.3 与 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 非 semver 的任意 tag:镜像 tag 与 git tag 同名
            type=ref,event=tag
            # v* 开头的 tag 同时更新 latest(供部署模板默认引用)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
